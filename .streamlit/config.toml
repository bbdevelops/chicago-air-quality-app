[server]
headless = true
# CORS is disabled so that XSRF protection stays active. Streamlit silently
# disables XSRF protection when CORS is enabled, so these two must not both be true.
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#111111"
primaryColor = "#00ff41"
textColor = "#e0e0e0"
font = "monospace"
