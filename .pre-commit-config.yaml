# Run `pre-commit install` once, then hooks run automatically on `git commit`.
# Manual full run: `pre-commit run --all-files`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # Keep committed notebooks free of bulky cell outputs.
        files: \.ipynb$
