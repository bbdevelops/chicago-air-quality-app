[socrata]
app_token_env_var = SOCRATA_APP_TOKEN
app_secret_env_var = SOCRATA_APP_SECRET
domain = data.cityofchicago.org
complaints_dataset_id = fypr-ksnz
openair_dataset_id = rtmx-vkjr
batch_size = 50000
cache_max_age_hours = 24
start_date = 2025-09-01T00:00:00

[cleaning]
max_sensor_distance_m = 2000
pm25_outlier_upper = 150.0
pm25_outlier_lower = 0.0

[epa]
# EPA Air Quality System (AQS) API — regulatory reference monitors.
# Credentials live in .env (see .env.example).
api_base = https://aqs.epa.gov/data/api
email_env_var = EPA_API_EMAIL
key_env_var = EPA_API_KEY
# Cook County, Illinois (FIPS state 17, county 031).
state_code = 17
county_code = 031
# Parameter codes: 88101 = PM2.5 FRM/FEM 24-hr, 42602 = NO2.
pm25_param = 88101
no2_param = 42602
